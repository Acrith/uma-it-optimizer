[package]
name = "uma_it_plugin"
version = "1.1.1"
# v1.0.0: full extractor JSON parity + auto-upload + minimal
# settings UI. From here on, semver: bump patch for fixes, minor
# for additive features, major for breaking capture-schema changes.
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hachimi-Edge plugin that captures Umamusume Independent Training runs."

[lib]
# cdylib = a Windows DLL exporting hachimi_init_v3. Name here becomes
# the base filename (uma_it_plugin.dll); Hachimi finds it by that
# name when the user adds it to windows.load_libraries.
name = "uma_it_plugin"
crate-type = ["cdylib"]

[dependencies]
edge-sdk = { path = "../edge-sdk" }
log = "0.4"
once_cell = "1.19"
# HTTP client for POST /api/runs. default-features off + tls only
# keeps the DLL small — no cookies, no JSON parsing, no proxy code
# we don't need. tls = rustls with webpki-roots (pure Rust, no
# system OpenSSL dependency, cross-compiles cleanly to Windows).
ureq = { version = "2.10", default-features = false, features = ["tls"] }
# Second-granularity local time for filename timestamps
# (YYYYMMDDTHHMMSS format matching the .exe extractor). std's
# SystemTime gives us epoch seconds — chrono formats them.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
